<div class="app-layout">
  <!-- Top Navigation Header -->
  <app-header></app-header>

  <!-- Split Screen Workspace -->
  <div class="workspace-container">
    <!-- Left Sidebar: Controls, Search, and Results -->
    <aside class="sidebar-pane">
      <!-- Tab Navigation Switcher -->
      <div class="tab-nav">
        <button 
          (click)="setTab('search')" 
          class="tab-btn" 
          [class.active-tab]="activeTab === 'search'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          PIN Search
        </button>

        <button 
          (click)="setTab('documents')" 
          class="tab-btn" 
          [class.active-tab]="activeTab === 'documents'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Documents Library
        </button>
      </div>

      <!-- Tab Content Area -->
      <div class="sidebar-content">
        <!-- Always allow quick uploads -->
        <app-pdf-uploader></app-pdf-uploader>

        <!-- Search Tab Content -->
        <div *ngIf="activeTab === 'search'">
          <app-pin-search></app-pin-search>
          <app-search-results></app-search-results>
        </div>

        <!-- Documents Tab Content -->
        <div *ngIf="activeTab === 'documents'">
          <app-document-list></app-document-list>
        </div>
      </div>
    </aside>

    <!-- Right Main Area: Embedded PDF Viewer -->
    <main class="viewer-pane">
      <app-pdf-viewer></app-pdf-viewer>
    </main>
  </div>
</div>
